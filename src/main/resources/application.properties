spring.application.name=ai-knowledge-platform

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_knowledge_db
spring.datasource.username=petkovismac
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# TODO This is optional, test and decide if it's needed
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable Flyway
spring.flyway.enabled=true
# Turn off Hibernate DDL automation so Flyway solely handles the schema
spring.jpa.hibernate.ddl-auto=validate

# Local directory where uploaded files will be stored
file.upload-dir=./uploads
